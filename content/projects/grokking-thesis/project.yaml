title: "Master's thesis: grokking and transfer learning"
date: 2025-05
category: research
repository: masters_thesis
private: true
skills: [dl-research, pytorch, experiment-design, visualisation, documents, python]

website:
  summary: >-
    Does a network that "groks" (generalises long after memorising its training data) learn
    representations that transfer? A grokked MLP was the best on MNIST and the worst at adapting
    to Fashion-MNIST.
  result: >-
    The grokked model reached 90.4% validation accuracy on MNIST, but only about 16.5% after
    fine-tuning on Fashion-MNIST, against about 70% for conventionally trained models.
  status: Published (two papers)
  hidden: true
