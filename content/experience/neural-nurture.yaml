website:
  # One line for the home page.
  summary: Learning-to-rank recommender (+40% NDCG@3), LLM fine-tuning (98.4% factual accuracy), multi-task NER (F1 above 94%).
  # Markdown.
  bullets:
    - Built a learning-to-rank recommendation system (LambdaMART/XGBoost) for the travel industry with custom relevance features, improving NDCG@3 by about 40% over the previous baseline, with SHAP and attention-weight explanations for end users.
    - Fine-tuned LLMs with SFT and LoRA to explain recommendations in natural language; found and fixed a training-data bias that caused hallucinations, raising factual accuracy to 98.4%.
    - Trained a multi-task NER and intent-classification model (RoBERTa) on 100,000 annotated samples across 44 entity classes, reaching F1 above 94%.
    - Designed the agentic tool-calling architecture for a conversational travel app, routing structured NER output to the right tools and external APIs, with attention to API terms of service and cost.
    - Designed an end-to-end evaluation framework that caught bugs early and monitors performance continuously.
    - Turned recent research into prototypes through controlled experiments across LLMs and conventional ML models, presented results and architecture proposals to senior leadership, and interviewed ML internship candidates.

