# Papers, newest first. Numbered [1], [2], ... in this order on the resume.

- key: grokking-review
  authors: [Agrawal T, Kumar M]
  year: 2025
  title: "Grokking in Neural Networks: A Review"
  venue: SN Computer Science 6:627
  url: https://doi.org/10.1007/s42979-025-04182-z
  url_label: DOI link
  website:
    summary: >-
      A survey of grokking, where a network generalises long after it has memorised its training
      data: when it happens, the explanations proposed for it, and open questions.
    project: grokking-thesis

- key: grokking-rigidity
  authors: [Agrawal T, Kumar M]
  year: 2025
  title: Analysis of Grokking-Induced Rigidity in Neural Networks using Transfer Learning
  venue: "In: Proceedings of Data Analytics and Management, ICDAM"
  website:
    summary: >-
      An MLP grokked on MNIST reached 90.4% validation accuracy but adapted far worse when
      fine-tuned on Fashion-MNIST than conventionally trained models; weight, loss-landscape and
      Hessian analyses point to rigidity from a flatter loss surface.
    project: grokking-thesis

