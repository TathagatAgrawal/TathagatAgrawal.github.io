[project]
name = "portfolio"
version = "1.0.0"
description = "Builds the portfolio website and resume PDFs from the files in content/."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typst>=0.15.2",
]

[project.scripts]
build = "portfolio.cli:main"
resume = "portfolio.cli:resume_main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
