# Dependabot opens a pull request when a GitHub Action or a Python dependency has a new version, so updates
# are reviewed before they reach the build. (Security alerts and security updates are switched on in the
# repository's settings.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
